<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Rascal Cinema</title>
  <style>
    :root {
      --bg: #14181c;
      --surface: #1c2228;
      --surface-2: #242c34;
      --border: #2c3440;
      --text: #e1e8ed;
      --muted: #99aabb;
      --green: #00e054;
      --green-dark: #00b844;
      --blue: #40bcf4;
      --orange: #ff8000;
      --red: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.topbar {
      background: #0f1316; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .nav-inner {
      max-width: 1220px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    }
    .brand {
      font-weight: 800; font-size: 1.15rem; color: #fff; letter-spacing: 0.4px;
      display: flex; align-items: center; gap: 8px;
    }
    .brand span.dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 8px var(--green);
    }
    nav.menu { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    nav.menu a {
      color: var(--muted); font-weight: 600; font-size: 0.92rem; padding: 6px 10px; border-radius: 6px;
    }
    nav.menu a:hover, nav.menu a.active { color: #fff; background: var(--surface-2); text-decoration: none; }
    .search-box { margin-left: auto; display: flex; gap: 6px; }
    .search-box input {
      background: var(--surface-2); border: 1px solid var(--border); color: #fff;
      padding: 6px 12px; border-radius: 20px; width: 210px; font-size: 0.9rem;
    }
    .user-nav { display: flex; gap: 10px; align-items: center; }
    .container { max-width: 1220px; margin: 0 auto; padding: 24px 20px 60px; }
    h1, h2, h3 { margin-top: 0; color: #fff; }
    h2.section-title {
      font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); border-bottom: 1px solid var(--border);
      padding-bottom: 8px; margin: 28px 0 16px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 18px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; transition: transform .15s, border-color .15s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--green); }
    .poster-wrap {
      aspect-ratio: 2 / 3; background: linear-gradient(145deg, #1f2833, #11161b);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster-fallback {
      padding: 14px; text-align: center; color: var(--muted); font-weight: 700; font-size: 0.95rem;
    }
    .card-body { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
    .card-meta { font-size: 0.82rem; color: var(--muted); display: flex; justify-content: space-between; }
    .stars { color: var(--green); font-weight: 700; }
    .pill {
      display: inline-block; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; margin: 3px 4px 3px 0;
    }
    .pill:hover { border-color: var(--blue); color: #fff; text-decoration: none; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;
      font-weight: 700; text-transform: uppercase; background: var(--surface-2); color: var(--green);
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-block; background: var(--green); color: #09110c; font-weight: 700;
      padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.92rem;
    }
    .btn:hover { background: var(--green-dark); text-decoration: none; }
    .btn-secondary { background: var(--surface-2); color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--blue); background: #2c3540; }
    .btn-danger { background: #3d1c1c; color: #ff8a8a; border: 1px solid #6b2929; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; margin-bottom: 20px;
    }
    .alert {
      padding: 12px 16px; border-radius: 8px; margin-bottom: 18px;
      background: #1b2836; border: 1px solid var(--blue); color: #d8ecff;
    }
    .alert.error { background: #311919; border-color: var(--red); color: #ffd4d4; }
    .alert.ok { background: #152b1e; border-color: var(--green); color: #d4ffe3; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    input[type=text], input[type=url], input[type=search], input[type=password], input[type=email], input[type=number], input[type=date], select, textarea {
      width: 100%; background: #12161a; border: 1px solid var(--border); color: #fff;
      padding: 9px 12px; border-radius: 6px; font-size: 0.93rem; font-family: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .player-frame {
      width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--border);
      border-radius: 10px; background: #000; display: block;
    }
    .movie-header { display: grid; grid-template-columns: 230px 1fr; gap: 26px; align-items: start; }
    @media (max-width: 760px) { .movie-header { grid-template-columns: 1fr; } }
    .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
    .stat-box {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 16px; min-width: 110px;
    }
    .stat-box .num { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .stat-box .lbl { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
  
    /* ── Ficha de película: cabecera con backdrop difuminado ───────────── */
    .hero { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); margin-bottom: 18px; }
    .hero-blur { position: absolute; inset: -24px; background: var(--backdrop, none) center / cover no-repeat;
                 filter: blur(18px) brightness(.32); transform: scale(1.05); pointer-events: none; }
    .hero:not(.has-backdrop) .hero-blur { background: linear-gradient(135deg, #1c2a33, #14181c); }
    .hero-content { position: relative; display: grid; grid-template-columns: 230px 1fr; gap: 28px; padding: 26px; }
    .hero-side { display: flex; flex-direction: column; gap: 12px; }
    .hero-poster { border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    .hero-poster img { width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; display: block; }
    .quick-actions { display: flex; flex-direction: column; gap: 8px; }
    .quick-actions form { margin: 0; }
    .btn-block { width: 100%; text-align: center; }
    .hero-title-row { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
    .hero-title-row h1 { margin: 0 0 4px; }
    .muted-year { color: var(--muted); font-weight: 400; }
    .original-title { color: var(--muted); font-style: italic; margin-bottom: 6px; }
    .tagline { color: var(--blue); font-weight: 600; }
    .synopsis { line-height: 1.55; max-width: 72ch; }
    .chips { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .credit-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .credit-label { width: 100%; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .tech-line { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: .88rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }
    .strong { font-weight: 700; }
    .trailer summary { cursor: pointer; font-weight: 700; font-size: 1rem; }
    .trailer-body { margin-top: 14px; }
    .p2p-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .player-box { margin: 12px 0 16px; }
    .player-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 8px; }
    .sources-table td.actions .actions-inner { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .sources-table td.actions form { margin: 0; }
    #rascal-player { aspect-ratio: auto; height: calc(56.25vw + 120px); max-height: 92vh; }
    .btn-sm { padding: 4px 10px; font-size: .8rem; }
    .btn-danger { background: #3d1c1c; color: #ff8a8a; border: 1px solid #6b2929; }
    .table-responsive { overflow-x: auto; }
    .distribution { display: flex; align-items: flex-end; gap: 8px; height: 96px; padding-top: 10px; }
    .dist-bar { flex: 1; text-align: center; }
    .dist-fill { background: var(--green); border-radius: 3px 3px 0 0; }
    .dist-label { font-size: .72rem; color: var(--muted); margin-top: 4px; }
    .check-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .review-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .review-body { margin: 8px 0; }
    .vote-form { display: inline-flex; gap: 6px; margin-top: 4px; }
    .spoiler summary { color: var(--orange); cursor: pointer; }

    /* ── Perfil ─────────────────────────────────────────────────────────── */
    .profile-head { display: flex; justify-content: space-between; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
    .profile-id { display: flex; gap: 18px; align-items: flex-start; }
    .profile-name { margin: 0; font-size: 1.6rem; }
    .profile-bio { margin: 8px 0 0; max-width: 60ch; }
    .profile-side { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
    .counters { display: flex; gap: 18px; }
    .counters a { color: var(--text); text-align: center; }
    .counters a:hover { text-decoration: none; color: var(--green); }
    .counters strong { display: block; font-size: 1.25rem; }
    .counters span { font-size: .78rem; color: var(--muted); text-transform: uppercase; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; }
    .avatar-lg { width: 112px; height: 112px; }
    .avatar-fallback { display: flex; align-items: center; justify-content: center; background: var(--surface-2);
                       color: var(--green); font-weight: 800; font-size: 1.6rem; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin: 18px 0; }
    .tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tabs a:hover { color: var(--text); text-decoration: none; }
    .tabs a.active { color: var(--text); border-bottom-color: var(--green); font-weight: 700; }
    .pinned { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .pinned-card { position: relative; display: block; border-radius: 8px; overflow: hidden; background: var(--surface-2); aspect-ratio: 2 / 3; }
    .pinned-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pinned-title { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px;
                    background: linear-gradient(transparent, rgba(0,0,0,.85)); font-size: .85rem; font-weight: 700; }
    .activity { margin-bottom: 10px; }
    .diary { list-style: none; padding: 0; margin: 0; }
    .diary-row { display: grid; grid-template-columns: 74px 44px 1fr 40px; gap: 12px; align-items: center;
                 padding: 10px 6px; border-bottom: 1px solid var(--border); }
    .diary-date { line-height: 1.1; }
    .diary-day { display: block; font-size: 1.4rem; font-weight: 800; }
    .diary-month { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
    .diary-poster { width: 44px; height: 66px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
    .diary-icons { text-align: center; color: var(--muted); font-size: 1.05rem; }
    .person-row { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
    .person-main { flex: 1; min-width: 0; }
    .person-row form { margin: 0; }

    /* ── Ajustes ───────────────────────────────────────────────────────── */
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start; }
    .settings-grid .panel form { margin: 0; }
    .avatar-edit { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 8px; }
    .avatar-edit > div { flex: 1 1 220px; }
    .fav-list { list-style: none; padding: 0; margin: 10px 0; }
    .fav-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
                   padding: 6px 0; border-bottom: 1px solid var(--border); }
    .fav-list li form { margin: 0; }
    .search-inline { display: flex; gap: 8px; margin-top: 12px; }
    .search-inline input { flex: 1; }

    /* ── v2.2: series, "Dónde ver", fuentes, paginación ─────────────────── */
    .type-line { display: flex; gap: 8px; align-items: center; margin: 2px 0 6px; }
    .card-type { position: absolute; top: 8px; left: 8px; z-index: 1; background: rgba(15,19,22,.85); color: var(--blue);
                 border: 1px solid var(--border); font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .where-to-watch { margin: 14px 0 4px; }
    .watch-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .watch-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 7px; border-radius: 8px;
                   background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .watch-badge:hover { border-color: var(--green); text-decoration: none; color: #fff; }
    .watch-badge img { border-radius: 5px; }
    .watch-name { font-weight: 700; font-size: .9rem; }
    .watch-offer { font-size: .72rem; color: var(--muted); border-left: 1px solid var(--border); padding-left: 8px; }
    .offer-free .watch-offer { color: var(--green); }
    .credit-item { display: inline-flex; align-items: center; gap: 2px; }
    .edit-bio { font-size: .72rem; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
    .edit-bio:hover { color: var(--blue); background: var(--surface-2); text-decoration: none; }
    .season-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin: 14px 0 12px; }
    .season-tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .season-tabs a:hover { color: var(--text); text-decoration: none; }
    .season-tabs a.active { color: #fff; border-bottom-color: var(--green); font-weight: 700; }
    .season-overview { color: var(--muted); max-width: 72ch; margin: 0 0 12px; }
    .episode-grid { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px;
                    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .episode-card { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 8px; border-radius: 8px;
                    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); height: 100%; }
    .episode-card:hover { border-color: var(--blue); text-decoration: none; }
    .episode-card.selected { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
    .episode-still { position: relative; aspect-ratio: 16 / 9; border-radius: 5px; overflow: hidden;
                     background: linear-gradient(145deg, #1f2833, #11161b); }
    .episode-still img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .episode-num { position: absolute; left: 6px; bottom: 4px; font-weight: 800; font-size: 1.1rem; color: #fff;
                   text-shadow: 0 1px 4px rgba(0,0,0,.9); }
    .episode-title { font-weight: 700; }
    .episode-synopsis { margin: 4px 0 0; font-size: .84rem; color: var(--muted); display: -webkit-box;
                        -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .episode-heading { margin: 18px 0 8px; }
    .privacy-note { border-left: 3px solid var(--orange); background: #2a2117; color: #f3dcc0; padding: 10px 12px;
                    border-radius: 0 6px 6px 0; font-size: .86rem; margin: 10px 0 14px; max-width: 90ch; }
    .source-type { font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .source-type.type-torrent, .source-type.type-magnet { color: var(--orange); }
    .source-type.type-direct_url, .source-type.type-hls { color: var(--green); }
    .sources-table tr.is-selected td { background: rgba(0,224,84,.05); }
    .pager { display: flex; gap: 16px; align-items: center; justify-content: center; margin: 22px 0; }
    .narrow { max-width: 440px; margin: 30px auto; }
    .bio-text { white-space: pre-line; line-height: 1.65; max-width: 75ch; }
    .person-head { display: grid; grid-template-columns: 200px 1fr; gap: 26px; align-items: start; }
    .person-photo { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 14px; font-size: .92rem; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    @media (max-width: 760px) {
      .person-head { grid-template-columns: 1fr; }
      .person-head .person-photo { max-width: 200px; }
      .episode-card { grid-template-columns: 110px 1fr; }
      .hero-content { grid-template-columns: 1fr; }
      .hero-side { flex-direction: row; align-items: flex-end; }
      .hero-side .poster-wrap { width: 40%; }
      .pinned { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .profile-side { align-items: flex-start; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="dot"></span> RASCAL CINEMA</a>
    <nav class="menu">
      <a href="/" class="{{ 'active' if nav == 'home' else '' }}">Inicio</a>
      <a href="/browse" class="{{ 'active' if nav == 'browse' else '' }}">Catálogo</a>
      <a href="/browse?type=series" class="{{ 'active' if nav == 'series' else '' }}">Series</a>
      <a href="/partner" class="{{ 'active' if nav == 'partner' else '' }}">Panel Partner</a>
    </nav>
    <form class="search-box" action="/search" method="get">
      <input type="text" name="q" placeholder="Películas, actores, estudios..." value="{{ q or '' }}">
    </form>
    <div class="user-nav">
      {% if viewer %}
        <a class="pill" href="/user/{{ viewer.username }}">@{{ viewer.username }} <span class="badge">{{ viewer.role.value }}</span></a>
        <a class="pill" href="/settings">Ajustes</a>
        <a class="btn btn-secondary" href="/logout" style="padding:5px 10px;font-size:0.82rem;">Salir</a>
      {% else %}
        <a class="btn" href="/login" style="padding:6px 12px;font-size:0.85rem;">Entrar / Registro</a>
      {% endif %}
    </div>
  </div>
</header>
<main class="container">
  {% if msg %}<div class="alert ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="alert error">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script nonce="{{ csp_nonce() }}">
/* Sin manejadores inline (la CSP los bloquea): confirmaciones y pósters de respaldo delegados. */
document.addEventListener("submit", function (ev) {
  var msg = ev.target.getAttribute && ev.target.getAttribute("data-confirm");
  if (msg && !window.confirm(msg)) { ev.preventDefault(); }
}, true);
/* El reproductor (iframe del mismo origen) informa su altura real: barra de idioma + video + estado. */
window.addEventListener("message", function (ev) {
  if (ev.origin !== window.location.origin || !ev.data || typeof ev.data.rascalPlayerHeight !== "number") { return; }
  var frame = document.getElementById("rascal-player");
  if (frame) { frame.style.height = Math.min(Math.max(ev.data.rascalPlayerHeight, 200), 4000) + "px"; frame.style.maxHeight = "none"; }
});
document.addEventListener("error", function (ev) {
  var img = ev.target;
  if (img.tagName === "IMG" && img.getAttribute("data-fallback") === "next") {
    img.style.display = "none";
    if (img.nextElementSibling) { img.nextElementSibling.style.display = "block"; }
  }
}, true);
</script>
</body>
</html>
