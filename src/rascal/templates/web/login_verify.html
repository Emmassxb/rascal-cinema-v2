{% extends "base.html" %}
{% block content %}
<form class="panel narrow" method="post" action="/login/verify">
  <h2>Escribe tu código de verificación</h2>
  <p class="muted">Enviamos un código de 6 dígitos a <strong>{{ masked_email }}</strong>. Caduca en 10 minutos.</p>
  <label for="code">Código</label>
  <input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
  <button class="btn" type="submit" style="margin-top:14px;width:100%;">Verificar y entrar</button>
  <p class="muted small" style="margin-top:12px;">¿No llegó? <a href="/login">Vuelve a iniciar sesión</a> para recibir otro.</p>
</form>
{% endblock %}
