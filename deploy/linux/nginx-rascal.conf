# /etc/nginx/sites-available/rascal-cinema   (enlázalo en sites-enabled y ejecuta `nginx -t`)
# Proxy inverso con HTTPS delante de uvicorn en 127.0.0.1:8001.
# Certificado: sudo certbot --nginx -d cine.ejemplo.com   (Certbot rellena/renueva las rutas ssl_*).

# Límites por IP en Nginx (primera barrera; la app tiene su propio rate limit con RASCAL_RATE_LIMIT_*).
limit_req_zone $binary_remote_addr zone=rascal_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rascal_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=rascal_conn:10m;

# Registro sin cadena de consulta: los tokens de reproducción (?token=…) no deben quedar en los logs.
log_format rascal_privacy '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

upstream rascal_app {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cine.ejemplo.com;
    # Certbot (http-01) y redirección permanente a HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx ≥ 1.25.1 prefiere «listen 443 ssl;» + «http2 on;»; esta forma funciona en 1.18–1.24 (Ubuntu 22.04/24.04, Debian 12).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cine.ejemplo.com;

    ssl_certificate     /etc/letsencrypt/live/cine.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cine.ejemplo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # protocolos y cifrados recomendados por Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 12m;          # .torrent ≤ 10 MB, subtítulos ≤ 2 MB, avatares
    client_body_timeout 30s;
    keepalive_timeout 65s;
    limit_conn rascal_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/rascal.access.log rascal_privacy;
    error_log  /var/log/nginx/rascal.error.log warn;

    # La app ya envía CSP con nonce, X-Frame-Options, nosniff, Referrer-Policy y (con
    # RASCAL_SECURE_COOKIES=true) HSTS. Aquí no se duplican para no generar cabeceras en conflicto.

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Nginx es el borde: se SOBRESCRIBE X-Forwarded-For con la IP real. Con $proxy_add_x_forwarded_for
    # un cliente podría anteponer una IP falsa y saltarse el rate limit de la app.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Login, registro y verificación 2FA: ráfagas cortas como máximo.
    location ~ ^/(login|login/verify|register)$ {
        limit_req zone=rascal_auth burst=5 nodelay;
        proxy_pass http://rascal_app;
    }

    # Video por Range (P2P) y remux al vuelo: sin buffer y con tiempos largos.
    location ~ ^/(stream|remux)/ {
        proxy_pass http://rascal_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Endpoints internos (ffprobe/ffmpeg en loopback) y de servicio: nunca desde Internet.
    location /internal/ { return 404; }
    location ~ ^/api/sources/[0-9]+/(start|stop|purge|probe)$ { return 404; }

    # Documentación OpenAPI fuera en producción.
    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }

    location / {
        limit_req zone=rascal_general burst=40 nodelay;
        proxy_pass http://rascal_app;
        proxy_read_timeout 60s;
    }
}
